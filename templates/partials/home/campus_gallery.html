{% load static %}
<section class="section campus-gallery-section">
  <div class="container">
    <div class="section-head" data-aos="fade-up">
      <!-- <span class="section-eyebrow">Life at SVU</span> -->
      <h2 class="section-title">Life at <span>SVU</span></h2>
    </div>

    <div class="gallery-grid">
      {% for item in campus_gallery_items %}
      <div class="gallery-tile" data-aos="fade-up" data-aos-delay="{{ forloop.counter0|add:1|stringformat:'d' }}00">
        <img src="{{ item.image }}" alt="{{ item.caption|default:'Swami Vivekananda University campus life' }}">
        {% if item.caption %}<span class="gallery-tile-caption">{{ item.caption }}</span>{% endif %}
      </div>
      {% endfor %}
    </div>
  </div>
</section>
