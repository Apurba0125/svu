{% load static %}
<section class="pride-strip">
  <div class="container">
    <div class="pride-inner" data-aos="fade-up">
      <div class="pride-text">
        <span class="section-eyebrow">Swami Vivekananda University</span>
        <h2 class="section-title text-start text-white">Trusted by Thousands, <span>Recognised Worldwide</span></h2>
        <p class="text-white-50 mt-2 mb-0">Growing Every Year, Excelling Every Way.</p>
      </div>
      <div class="pride-slider">
        <div class="swiper pride-slider-swiper">
          <div class="swiper-wrapper">
            <div class="swiper-slide">
              <img src="{% static 'img/rbangla.jpeg' %}" alt="Panel discussion at R. Bangla Shikkhar Gourab 2026, with Swami Vivekananda University listed as a partner">
            </div>
            <div class="swiper-slide">
              <img src="{% static 'img/481233106_972665624970210_8860091325710493319_n.jpg.jpeg' %}" alt="Swami Vivekananda University representatives receiving the Zee 24 Ghanta Education Excellence 2024 award for Excellence in Academic Infrastructure &amp; Activities">
            </div>
            <div class="swiper-slide">
              <img src="{% static 'img/481979442_972665414970231_8854528053355663625_n.jpg.jpeg' %}" alt="Swami Vivekananda University representatives on stage with the Zee 24 Ghanta Education Excellence 2024 plaque and memento">
            </div>
            <div class="swiper-slide">
              <img src="{% static 'img/482247234_972659861637453_1522331182250338419_n.jpg.jpeg' %}" alt="Swami Vivekananda University accepting a trophy at the News18 Bangla Education Eminence 2024 awards">
            </div>
           
            <div class="swiper-slide">
              <img src="{% static 'img/536270821_1105990098304428_367322835841659546_n.jpg.jpeg' %}" alt="Swami Vivekananda University faculty holding NPTEL certificates, including recognition for Best Faculty Performance in NPTEL online certification courses, January to April 2025">
            </div>
            <div class="swiper-slide">
              <img src="{% static 'img/540903586_1105990141637757_7221139477378257898_n.jpg.jpeg' %}" alt="Swami Vivekananda University receiving a certificate at the SWAYAM-NPTEL SPOC Workshop 2025, East Zone, hosted by IIT Kharagpur">
            </div>
            <div class="swiper-slide">
              <img src="{% static 'img/NPTEL_1.jpeg' %}" alt="A Swami Vivekananda University faculty member receiving an NPTEL STAR Award at the felicitation ceremony">
            </div>
            <div class="swiper-slide">
              <img src="{% static 'img/MPTEL_2.jpeg' %}" alt="A Swami Vivekananda University faculty member being presented with an NPTEL STAR Award trophy on stage">
            </div>
            <div class="swiper-slide">
              <img src="{% static 'img/MPTEL_3.jpeg' %}" alt="An NPTEL STAR Award being handed to a Swami Vivekananda University faculty member at the IIT Kharagpur felicitation">
            </div>
            <div class="swiper-slide">
              <img src="{% static 'img/MPTEL_4.jpeg' %}" alt="A Swami Vivekananda University faculty member accepting an NPTEL STAR Award trophy">
            </div>
          </div>
          <div class="swiper-pagination pride-slider-pagination"></div>
        </div>
      </div>
    </div>
  </div>
</section>
