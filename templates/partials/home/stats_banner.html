{% load static %}
<section class="stats-banner-section">
  <div class="container">
    <div class="swiper stats-banner-swiper">
      <div class="swiper-wrapper">
        {% for item in stat_highlights %}
        <div class="swiper-slide">
          <div class="stats-banner-item">
            <img class="stats-banner-icon" src="{{ item.icon }}" alt="{{ item.label }}" width="65" height="65" loading="lazy">
            <span class="stats-banner-value">{{ item.value }}</span>
            <span class="stats-banner-label">{{ item.label }}</span>
          </div>
        </div>
        {% endfor %}
      </div>
    </div>
  </div>
</section>
